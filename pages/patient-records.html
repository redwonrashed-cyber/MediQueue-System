<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediQueue - Patient Records</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="navbar">
    <h1>MediQueue - Patient Records</h1>
    <button style="width:auto;" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Add / Update Record</h2>
      <input type="text" id="patientName" placeholder="Patient Name">
      <input type="text" id="diagnosis" placeholder="Diagnosis / Notes">
      <button onclick="saveRecord()">Save Record</button>
    </div>

    <div class="card">
      <h2>All Patient Records</h2>
      <table id="recordTable">
        <thead><tr><th>Patient</th><th>Diagnosis / Notes</th><th>Date</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/patientRecords.js"></script>
</body>
</html>
