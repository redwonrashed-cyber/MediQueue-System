<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediQueue - Doctor Schedule</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="navbar">
    <h1>MediQueue - Doctor</h1>
    <button style="width:auto;" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Add Availability Slot</h2>
      <input type="date" id="slotDate">
      <input type="time" id="slotTime">
      <button onclick="addSlot()">Add Slot</button>
    </div>

    <div class="card">
      <h2>My Schedule</h2>
      <table id="slotTable">
        <thead><tr><th>Date</th><th>Time</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Upcoming Appointments</h2>
      <table id="appointmentTable">
        <thead><tr><th>Patient</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/doctorSchedule.js"></script>
</body>
</html>
